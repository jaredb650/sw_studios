# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main, on demand, and once a day so finished events
# move from the agenda to the archive without anyone editing the site.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # 13:15 UTC = 9:15 AM in Puerto Rico, after late-night events have ended.
    - cron: '15 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
